<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 主背景渐变 - 时光流水主题 -->
    <radialGradient id="bgGradient" cx="50%" cy="30%" r="80%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c3e50;stop-opacity:1" />
    </radialGradient>
    
    <!-- 流水渐变 -->
    <linearGradient id="waterGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#74b9ff;stop-opacity:0.9" />
      <stop offset="30%" style="stop-color:#0984e3;stop-opacity:0.7" />
      <stop offset="70%" style="stop-color:#00b894;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#00cec9;stop-opacity:0.8" />
    </linearGradient>
    
    <!-- 时间轮盘渐变 -->
    <linearGradient id="timeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95" />
      <stop offset="50%" style="stop-color:#f8f9fa;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:0.85" />
    </linearGradient>
    
    <!-- 光晕效果 -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 阴影滤镜 -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#1a202c" flood-opacity="0.3"/>
    </filter>
    
    <!-- 流水动画路径 -->
    <path id="waterPath1" d="M100,400 Q300,350 500,400 T900,400" fill="none"/>
    <path id="waterPath2" d="M100,500 Q350,450 600,500 T900,500" fill="none"/>
    <path id="waterPath3" d="M100,600 Q250,550 450,600 T900,600" fill="none"/>
    
    <!-- 时间刻度渐变 -->
    <linearGradient id="tickGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#74b9ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0984e3;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 圆角背景 -->
  <rect width="1024" height="1024" rx="220" ry="220" fill="url(#bgGradient)" filter="url(#shadow)"/>
  
  <!-- 中央时间轮盘 -->
  <circle cx="512" cy="512" r="280" fill="url(#timeGradient)" filter="url(#glow)" opacity="0.95"/>
  <circle cx="512" cy="512" r="260" fill="none" stroke="url(#tickGradient)" stroke-width="3" opacity="0.8"/>
  
  <!-- 时间刻度 -->
  <g transform="translate(512,512)">
    <!-- 12小时刻度 -->
    <g stroke="url(#tickGradient)" stroke-width="4" opacity="0.9">
      <line x1="0" y1="-240" x2="0" y2="-220" transform="rotate(0)"/>
      <line x1="0" y1="-240" x2="0" y2="-220" transform="rotate(30)"/>
      <line x1="0" y1="-240" x2="0" y2="-220" transform="rotate(60)"/>
      <line x1="0" y1="-240" x2="0" y2="-220" transform="rotate(90)"/>
      <line x1="0" y1="-240" x2="0" y2="-220" transform="rotate(120)"/>
      <line x1="0" y1="-240" x2="0" y2="-220" transform="rotate(150)"/>
      <line x1="0" y1="-240" x2="0" y2="-220" transform="rotate(180)"/>
      <line x1="0" y1="-240" x2="0" y2="-220" transform="rotate(210)"/>
      <line x1="0" y1="-240" x2="0" y2="-220" transform="rotate(240)"/>
      <line x1="0" y1="-240" x2="0" y2="-220" transform="rotate(270)"/>
      <line x1="0" y1="-240" x2="0" y2="-220" transform="rotate(300)"/>
      <line x1="0" y1="-240" x2="0" y2="-220" transform="rotate(330)"/>
    </g>
    
    <!-- 时针 -->
    <line x1="0" y1="0" x2="0" y2="-120" stroke="#2c3e50" stroke-width="8" stroke-linecap="round" transform="rotate(90)" opacity="0.9"/>
    <!-- 分针 -->
    <line x1="0" y1="0" x2="0" y2="-160" stroke="#667eea" stroke-width="6" stroke-linecap="round" transform="rotate(180)" opacity="0.9"/>
    <!-- 秒针 -->
    <line x1="0" y1="0" x2="0" y2="-180" stroke="#74b9ff" stroke-width="2" stroke-linecap="round" transform="rotate(270)" opacity="0.8"/>
    
    <!-- 中心圆点 -->
    <circle cx="0" cy="0" r="12" fill="#2c3e50" opacity="0.9"/>
    <circle cx="0" cy="0" r="6" fill="#ffffff" opacity="0.95"/>
  </g>
  
  <!-- 流水波纹效果 -->
  <g opacity="0.6">
    <!-- 第一层流水 -->
    <path d="M100,400 Q300,350 500,400 T900,400" stroke="url(#waterGradient)" stroke-width="12" fill="none" opacity="0.8">
      <animate attributeName="d" 
               values="M100,400 Q300,350 500,400 T900,400;M100,400 Q350,380 550,400 T900,400;M100,400 Q300,350 500,400 T900,400" 
               dur="4s" repeatCount="indefinite"/>
    </path>
    
    <!-- 第二层流水 -->
    <path d="M100,500 Q350,450 600,500 T900,500" stroke="url(#waterGradient)" stroke-width="10" fill="none" opacity="0.7">
      <animate attributeName="d" 
               values="M100,500 Q350,450 600,500 T900,500;M100,500 Q300,480 550,500 T900,500;M100,500 Q350,450 600,500 T900,500" 
               dur="5s" repeatCount="indefinite"/>
    </path>
    
    <!-- 第三层流水 -->
    <path d="M100,600 Q250,550 450,600 T900,600" stroke="url(#waterGradient)" stroke-width="8" fill="none" opacity="0.6">
      <animate attributeName="d" 
               values="M100,600 Q250,550 450,600 T900,600;M100,600 Q300,580 500,600 T900,600;M100,600 Q250,550 450,600 T900,600" 
               dur="6s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- 时光粒子效果 -->
  <g opacity="0.4">
    <circle cx="200" cy="300" r="3" fill="#74b9ff">
      <animate attributeName="cy" values="300;800;300" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="250" r="2" fill="#00cec9">
      <animate attributeName="cy" values="250;750;250" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="650" cy="280" r="4" fill="#0984e3">
      <animate attributeName="cy" values="280;780;280" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="800" cy="320" r="2.5" fill="#00b894">
      <animate attributeName="cy" values="320;820;320" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="9s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- 顶部光泽效果 -->
  <ellipse cx="512" cy="300" rx="400" ry="120" fill="url(#waterGradient)" opacity="0.15"/>
  <ellipse cx="512" cy="280" rx="350" ry="80" fill="#ffffff" opacity="0.1"/>
  
</svg>
